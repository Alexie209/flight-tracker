name: check-fares
on:
  schedule:
    - cron: "17 6 * * *"   # daily, off-peak minute
  workflow_dispatch:
concurrency: check-fares
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          LETSFG_API_KEY: ${{ secrets.LETSFG_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save history
        run: |
          git config user.name "fare-bot"; git config user.email "fare-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Update fares" && git push)
